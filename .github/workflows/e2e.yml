name: Playwright E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Unit + smoke + Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      E2E_CHROMIUM_EXECUTABLE: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11.15
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-e2e.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-e2e.txt

      - name: Install matching Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run unit and regression tests
        run: python -m pytest -q

      - name: Run smoke test
        run: python tests/smoke_test.py

      - name: Run Playwright E2E
        run: bash scripts/run_e2e.sh

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/_artifacts/
          if-no-files-found: ignore
          retention-days: 7
